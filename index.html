(function () {
  var TOPICS = [
    { id: 'algo', name: 'Алгоритмы и структуры данных', short: 'Алгоритмы', ch: 'Глава 1', icon: '🧮', desc: 'Хеш-таблицы, два указателя, окно, бинпоиск, кучи, графы, DP.' },
    { id: 'py', name: 'Python: тонкости языка', short: 'Python', ch: 'Глава 2', icon: '🐍', desc: 'Модель данных, замыкания, генераторы, MRO, GIL, NumPy, pandas, PyTorch.' },
    { id: 'math', name: 'Математика и статистика', short: 'Математика', ch: 'Глава 3', icon: '📐', desc: 'Линейная алгебра, вероятности, MLE/MAP, A/B-тесты.' },
    { id: 'ml', name: 'Классический ML и метрики', short: 'Classic ML', ch: 'Глава 4', icon: '🌲', desc: 'Bias-variance, бустинг, метрики, утечки, калибровка.' },
    { id: 'dl', name: 'Deep Learning, Transformers, LLM', short: 'Deep Learning', ch: 'Глава 5', icon: '🧠', desc: 'Backprop, нормализации, CNN, attention, LoRA, RLHF, RAG.' },
    { id: 'code', name: 'ML-кодинг, лайв-кодинг, SQL', short: 'Кодинг', ch: 'Главы 6–7', icon: '⌨️', desc: 'Реализации с нуля, потоковые алгоритмы, SQL.' },
    { id: 'sd', name: 'ML System Design и проекты', short: 'System Design', ch: 'Главы 8–9', icon: '🏗️', desc: 'Рекомендации, антифрод, поиск, RAG, STAR.' }
  ];
  var TOPIC = {};
  TOPICS.forEach(function (t) { TOPIC[t.id] = t; });
  var KIND = { c: 'Выбор ответа', n: 'Число', i: 'Короткий ответ', o: 'Развёрнутый ответ' };
  var EXAM_N = 25, EXAM_MIN = 30;

  var app = document.getElementById('app');

  // ---------- утилиты ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === false || v == null) return;
        if (k === 'class') el.className = v;
        else if (k === 'on') Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
        else if (k === 'style') el.style.cssText = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function hid(q) {
    var s = q.t + '|' + q.q + '|' + (q.code || ''), x = 5381;
    for (var i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
    return (x >>> 0).toString(36);
  }
  function plural(n, a, b, c) {
    var m = Math.abs(n) % 100, d = m % 10;
    if (m > 10 && m < 20) return c;
    if (d > 1 && d < 5) return b;
    if (d === 1) return a;
    return c;
  }
  function ask(text, okLabel, onOk) {
    var back = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
    function close() { if (back.parentNode) back.parentNode.removeChild(back); }
    back.appendChild(h('div', { class: 'modal-box' },
      h('p', { style: 'font-weight:600;margin-bottom:14px' }, text),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', on: { click: close } }, 'Отмена'),
        h('button', { class: 'btn primary', on: { click: function () { close(); onOk(); } } }, okLabel))));
    back.addEventListener('click', function (e) { if (e.target === back) close(); });
    document.body.appendChild(back);
  }
  var tmr = null;
  function toast(msg) {
    var t = h('div', { class: 'toast', role: 'status' }, msg);
    document.body.appendChild(t);
    clearTimeout(tmr);
    tmr = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  // текст с `кодом`
  function rich(text) {
    var f = document.createDocumentFragment();
    String(text).split(/(`[^`]+`)/g).forEach(function (p) {
      if (!p) return;
      if (p.length > 1 && p.charAt(0) === '`' && p.charAt(p.length - 1) === '`') f.appendChild(h('code', null, p.slice(1, -1)));
      else f.appendChild(document.createTextNode(p));
    });
    return f;
  }
  // подсветка Python
  var PY_RE = /(#.*$)|("[^"\n]*"|'[^'\n]*')|\b(def|class|return|if|else|elif|for|while|in|not|and|or|is|None|True|False|import|from|as|try|except|finally|raise|with|lambda|yield|pass|break|continue|nonlocal|global)\b|(\b\d+(?:\.\d+)?\b)/gm;
  function codeBlock(code) {
    var pre = h('pre', { class: 'code' }), c = h('code'), last = 0, m;
    PY_RE.lastIndex = 0;
    while ((m = PY_RE.exec(code))) {
      if (m.index > last) c.appendChild(document.createTextNode(code.slice(last, m.index)));
      var cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : 'tk-num';
      c.appendChild(h('span', { class: cls }, m[0]));
      last = PY_RE.lastIndex;
      if (m[0].length === 0) PY_RE.lastIndex++;
    }
    if (last < code.length) c.appendChild(document.createTextNode(code.slice(last)));
    pre.appendChild(c);
    return pre;
  }

  // ---------- состояние и хранилище ----------
  var KEY = 'mlq_v1', storageOK = true;
  function loadState() {
    var s = null;
    try { var raw = localStorage.getItem(KEY); if (raw) s = JSON.parse(raw); } catch (e) { storageOK = false; }
    if (!s || typeof s !== 'object') s = {};
    s.q = s.q || {}; s.f = s.f || {}; s.days = s.days || {}; s.exams = s.exams || [];
    s.set = s.set || {};
    s.set.types = s.set.types || { c: 1, n: 1, i: 1, o: 1 };
    s.set.size = s.set.size || 10;
    s.theme = s.theme || 'auto';
    try { localStorage.setItem(KEY + '_t', '1'); localStorage.removeItem(KEY + '_t'); } catch (e) { storageOK = false; }
    return s;
  }
  var S = loadState();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } }

  function applyTheme() {
    // «auto»: ничего не трогаем, тема берётся из системы (или из выбора, который сделала оболочка просмотра)
    if (S.theme !== 'auto') document.documentElement.setAttribute('data-theme', S.theme);
  }
  function isDark() {
    var t = S.theme !== 'auto' ? S.theme : document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  applyTheme();

  // ---------- вопросы ----------
  var byId = {};
  QS.forEach(function (q) { q.id = hid(q); byId[q.id] = q; });

  function pool(topic, types) {
    return QS.filter(function (q) { return (!topic || q.t === topic) && (!types || types[q.k]); });
  }
  function pick(qs, n) {
    var scored = qs.map(function (q) {
      var r = S.q[q.id], w = !r ? 2 : (r.l === 'w' ? 3.5 : 1);
      return { id: q.id, k: Math.pow(Math.random(), 1 / w) };
    });
    scored.sort(function (a, b) { return b.k - a.k; });
    return scored.slice(0, n).map(function (x) { return x.id; });
  }
  function dkey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function streak() {
    var n = 0, d = new Date();
    if (!S.days[dkey(d)]) d.setDate(d.getDate() - 1);
    while (S.days[dkey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function stats(tid) {
    var qs = QS.filter(function (q) { return !tid || q.t === tid; }), ok = 0, wrong = 0;
    qs.forEach(function (q) { var r = S.q[q.id]; if (r) { if (r.l === 'c') ok++; else wrong++; } });
    return { total: qs.length, ok: ok, wrong: wrong, left: qs.length - ok - wrong };
  }
  function wrongIds(tid) {
    return QS.filter(function (q) { var r = S.q[q.id]; return (!tid || q.t === tid) && r && r.l === 'w'; }).map(function (q) { return q.id; });
  }
  function record(q, ok) {
    var r = S.q[q.id] || (S.q[q.id] = { c: 0, w: 0, l: null, t: 0 });
    if (ok) r.c++; else r.w++;
    r.l = ok ? 'c' : 'w'; r.t = Date.now();
    var k = dkey(); S.days[k] = (S.days[k] || 0) + 1;
    save();
  }
  function flipToCorrect(q) {
    var r = S.q[q.id];
    if (!r) return;
    if (r.w > 0) r.w--;
    r.c++; r.l = 'c';
    save();
  }

  // ---------- проверка ответов ----------
  var HOMO = { 'о': 'o', 'а': 'a', 'е': 'e', 'с': 'c', 'р': 'p', 'х': 'x', 'у': 'y', 'в': 'b', 'к': 'k', 'м': 'm', 'н': 'h', 'т': 't' };
  function norm(s) {
    return String(s).toLowerCase().replace(/ё/g, 'е').replace(/[·×]/g, '*')
      .replace(/[\s`'"«» ]/g, '').replace(/[.!]+$/, '')
      .replace(/[а-я]/g, function (c) { return HOMO[c] || c; });
  }
  function parseNum(s) {
    var raw = String(s).trim(), pct = raw.indexOf('%') >= 0;
    var t = raw.replace(/,/g, '.').replace(/[\s%≈~]/g, '');
    var m = t.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/), v;
    if (m) v = parseFloat(m[1]) / parseFloat(m[2]);
    else if (/^-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?$/i.test(t)) v = parseFloat(t);
    else return { v: NaN, pct: pct };
    return { v: v, pct: pct };
  }
  function numOK(q, text) {
    var p = parseNum(text);
    if (isNaN(p.v)) return false;

    var verdict = pct >= 85 ? 'Отлично!' : pct >= 65 ? 'Хороший результат' : pct >= 40 ? 'Есть над чем поработать' : 'Нужно повторить материал';
    var card = h('div', { class: 'card' },
      h('div', { class: 'score' }, h('div', { class: 'big', style: 'color:' + (pct >= 65 ? 'var(--ok)' : pct >= 40 ? 'var(--warn)' : 'var(--bad)') }, pct + '%'),
        h('div', { class: 'lbl' }, session.label + ': ' + ok + ' из ' + ids.length + ' · ' + verdict)));
    // по темам
    var by = {};
    ids.forEach(function (id) { var q = byId[id]; var b = by[q.t] || (by[q.t] = { n: 0, ok: 0 }); b.n++; if (session.res[id] && session.res[id].ok) b.ok++; });
    var tb = h('table', { class: 'rt' }, h('tr', null, h('th', null, 'Тема'), h('th', null, 'Верно'), h('th', null, '')));
    TOPICS.filter(function (t) { return by[t.id]; }).forEach(function (t) {
      var b = by[t.id];
      tb.appendChild(h('tr', { class: 't-' + t.id }, h('td', null, t.icon + ' ' + t.short), h('td', null, b.ok + ' / ' + b.n),
        h('td', { style: 'width:35%' }, bar({ total: b.n, ok: b.ok, wrong: b.n - b.ok, left: 0 }))));
    });
    if (Object.keys(by).length > 1) { card.appendChild(h('h2', { style: 'margin-top:16px' }, 'По темам')); card.appendChild(tb); }
    var bad = ids.filter(function (id) { return !(session.res[id] && session.res[id].ok); });
    card.appendChild(h('div', { class: 'actions', style: 'margin-top:16px' },
      bad.length ? h('button', { class: 'btn primary', on: { click: function () { startSession({ mode: 'mistakes', label: 'Повтор ошибок', ids: shuffle(bad) }); } } }, 'Повторить ошибки (' + bad.length + ')') : null,
      h('button', { class: 'btn', on: { click: function () { again(); } } }, 'Новый тест'),
      h('button', { class: 'btn ghost', on: { click: function () { session = null; go('#/'); } } }, 'На главную')));
    wrap.appendChild(card);

    if (bad.length) {
      wrap.appendChild(h('h2', null, 'Разбор ошибок'));
      bad.forEach(function (id) {
        var q = byId[id], r = session.res[id];
        var c = h('div', { class: 'card mistake t-' + q.t },
          h('div', { class: 'q-meta' }, h('span', { class: 'chip t' }, TOPIC[q.t].icon + ' ' + TOPIC[q.t].short), h('span', { class: 'chip' }, KIND[q.k])),
          h('p', { class: 'qtext', style: 'font-size:16px' }, rich(q.q)));
        if (q.code) c.appendChild(codeBlock(q.code));
        c.appendChild(h('div', { class: 'small', style: 'margin-bottom:6px' }, h('b', null, 'Ваш ответ: '), r ? (r.given || '—') : '— нет ответа —'));
        c.appendChild(h('div', { class: 'small', style: 'margin-bottom:8px;color:var(--ok)' }, h('b', null, 'Правильный ответ: '), q.k === 'o' ? '(эталон ниже)' : correctText(q)));
        if (q.k === 'o') c.appendChild(h('div', { class: 'explain' }, h('div', { class: 'ex-t' }, 'Эталон'), q.ref));
        if (q.e) c.appendChild(h('div', { class: 'explain' }, h('div', { class: 'ex-t' }, q.k === 'o' ? 'Совет' : 'Разбор'), rich(q.e)));
        wrap.appendChild(c);
      });
    }
    return wrap;
  }
  function again() {
    if (session.exam) return startExam();
    if (session.mode === 'topic') { var qs = pool(session.topic, S.set.types); return startSession({ mode: 'topic', label: session.label, topic: session.topic, ids: pick(qs, S.set.size || qs.length) }); }
    startMix();
  }

  // ---------- карточки ----------
  function answerText(q) {
    if (q.k === 'c') return q.o[q.a];
    if (q.k === 'n') return String(q.v) + (q.tol ? '  (допустимо ±' + q.tol + ')' : '');
    if (q.k === 'i') return q.acc[0];
    return q.ref;
  }
  function viewCards(arg) {
    var tid = TOPIC[arg] ? arg : null;
    if (!cardSession || cardSession.key !== (tid || 'all')) {
      var qs = pool(tid, null).map(function (q) { return q.id; });
      var unk = qs.filter(function (id) { return S.f[id] !== 'k'; });
      var ids = unk.length ? shuffle(unk) : shuffle(qs);
      cardSession = { key: tid || 'all', queue: ids, total: ids.length, flipped: false, known: 0 };
    }
    var cs = cardSession, wrap = h('div', { class: tid ? 't-' + tid : '' });
    wrap.appendChild(h('div', { class: 'topbar' }, backBtn(tid ? 'К теме' : 'Главная', tid ? '#/topic/' + tid : '#/'), h('div', { class: 'grow' }), themeBtn()));
    wrap.appendChild(h('div', { class: 'hdr' }, h('div', { class: 'grow' }, h('h1', null, '🗂️ Карточки'), h('div', { class: 'sub' }, (tid ? TOPIC[tid].name : 'Все темы')))));
    // выбор темы
    var chips = h('div', { class: 'row', style: 'margin-bottom:12px' });
    [{ id: null, short: 'Все' }].concat(TOPICS).forEach(function (t) {
      chips.appendChild(h('button', { class: 'chip' + ((t.id || null) === tid ? ' on' : ''), on: { click: function () { cardSession = null; go('#/cards/' + (t.id || 'all')); } } }, t.short));
    });
    wrap.appendChild(chips);
    if (!cs.queue.length) {
      wrap.appendChild(h('div', { class: 'card score' }, h('div', { class: 'big' }, '🎉'), h('div', { class: 'lbl' }, 'Колода пройдена: выучено ' + cs.known + ' из ' + cs.total),
        h('div', { class: 'actions', style: 'margin-top:14px;justify-content:center' },
          h('button', { class: 'btn primary', on: { click: function () { cardSession = null; render(); } } }, 'Ещё раз'),
          h('button', { class: 'btn', on: { click: function () { go(tid ? '#/topic/' + tid : '#/'); } } }, 'Назад'))));
      return wrap;
    }
    var q = byId[cs.queue[0]];
    wrap.appendChild(h('div', { class: 'row small muted', style: 'justify-content:space-between;margin-bottom:8px' }, h('span', null, 'Выучено: ' + cs.known + ' / ' + cs.total), h('span', null, 'В колоде: ' + cs.queue.length)));
    var card = h('div', { class: 'card flash', role: 'button', tabindex: '0', 'aria-label': 'Перевернуть карточку', on: {
      click: function (e) { if (e.target.closest && e.target.closest('button')) return; cs.flipped = !cs.flipped; render(true); },
      keydown: function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cs.flipped = !cs.flipped; render(true); } }
    } });
    var face = h('div', { class: 'face' });
    face.appendChild(h('div', { class: 'q-meta' }, h('span', { class: 'chip t t-' + q.t, style: '--tc:var(--c-' + q.t + ')' }, TOPIC[q.t].icon + ' ' + TOPIC[q.t].short), h('span', { class: 'chip' }, cs.flipped ? 'Ответ' : 'Вопрос')));
    face.appendChild(h('p', { class: 'qtext', style: 'font-size:' + (cs.flipped ? '15px' : '18px') }, rich(q.q)));
    if (q.code && !cs.flipped) face.appendChild(codeBlock(q.code));
    if (cs.flipped) {
      if (q.code) face.appendChild(codeBlock(q.code));
      face.appendChild(h('div', { class: 'explain', style: 'background:var(--okbg);border-color:transparent' }, h('div', { class: 'ex-t', style: 'color:var(--ok)' }, 'Ответ'), rich(answerText(q))));
      if (q.e) face.appendChild(h('div', { class: 'explain' }, h('div', { class: 'ex-t' }, q.k === 'o' ? 'Совет' : 'Разбор'), rich(q.e)));
    }
    card.appendChild(face);
    if (!cs.flipped) card.appendChild(h('div', { class: 'hint' }, 'Нажмите на карточку, чтобы увидеть ответ'));
    wrap.appendChild(card);
    var act = h('div', { class: 'actions' });
    if (!cs.flipped) act.appendChild(h('button', { class: 'btn primary', on: { click: function () { cs.flipped = true; render(true); } } }, 'Показать ответ'));
    else {
      act.appendChild(h('button', { class: 'btn', on: { click: function () { var id = cs.queue.shift(); cs.queue.push(id); S.f[id] = 'r'; save(); cs.flipped = false; render(); } } }, '↻ Повторить позже'));
      act.appendChild(h('button', { class: 'btn primary', on: { click: function () { var id = cs.queue.shift(); S.f[id] = 'k'; cs.known++; save(); cs.flipped = false; render(); } } }, '✓ Знаю'));
    }
    wrap.appendChild(act);
    return wrap;
  }

  // ---------- шпаргалка ----------
  function viewCheat() {
    var wrap = h('div');
    wrap.appendChild(h('div', { class: 'topbar' }, backBtn('Главная'), h('div', { class: 'grow' }), themeBtn()));
    wrap.appendChild(h('div', { class: 'hdr' }, h('div', { class: 'grow' }, h('h1', null, '📄 Шпаргалка'), h('div', { class: 'sub' }, 'Всё важное для быстрого повторения перед собеседованием'))));
    var search = h('input', { type: 'search', class: 'search', placeholder: 'Поиск по шпаргалке…', 'aria-label': 'Поиск по шпаргалке', autocomplete: 'off' });
    wrap.appendChild(search);
    var sections = [];
    CHEAT.forEach(function (sec, idx) {
      var body = h('div', { class: 'body' }), items = [];
      if (sec.kind === 'table') {
        var tb = h('table', { class: 'ct', style: 'min-width:' + (sec.head.length * 165) + 'px' }, h('tr', null, sec.head.map(function (x) { return h('th', null, x); })));
        sec.rows.forEach(function (r) {
          var tr = h('tr', null, r.map(function (c) { return h('td', null, rich(c)); }));
          tb.appendChild(tr); items.push({ el: tr, text: r.join(' ').toLowerCase() });
        });
        body.appendChild(h('div', { class: 'tw' }, tb));
      } else {
        var ul = h('ul', { class: 'cl' });
        sec.items.forEach(function (x) { var li = h('li', null, rich(x)); ul.appendChild(li); items.push({ el: li, text: x.toLowerCase() }); });
        body.appendChild(ul);
      }
      var d = h('details', { class: 'sec', open: idx === 0 }, h('summary', null, sec.t), body);
      wrap.appendChild(d);
      sections.push({ el: d, title: sec.t.toLowerCase(), items: items, open: idx === 0 });
    });
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      sections.forEach(function (s) {
        if (!q) { s.el.classList.remove('hide'); s.items.forEach(function (i) { i.el.classList.remove('hide'); }); s.el.open = s.open; return; }
        var titleHit = s.title.indexOf(q) >= 0, any = false;
        s.items.forEach(function (i) { var hit = titleHit || i.text.indexOf(q) >= 0; i.el.classList.toggle('hide', !hit); if (hit) any = true; });
        s.el.classList.toggle('hide', !any && !titleHit);
        if (any || titleHit) s.el.open = true;
      });
    });
    return wrap;
  }

  // ---------- клавиатура ----------
  document.addEventListener('keydown', function (e) {
    var r = parseHash();
    if (r.name !== 'play' || !session || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var q = byId[session.ids[session.i]], cur = session.cur;
    if (q.k === 'c' && /^[1-4]$/.test(e.key)) {
      var pos = parseInt(e.key, 10) - 1;
      if (pos < cur.order.length) { e.preventDefault(); pickChoice(q, cur.order[pos]); }
    } else if (e.key === 'Enter' && cur.done && !session.exam && q.k !== 'o') { e.preventDefault(); next(); }
  });

  if (!QS.length) app.textContent = 'Банк вопросов пуст.';
  else render();

  // офлайн-режим: работает только когда страница открыта по https (или localhost); иначе молча пропускается
  try {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  } catch (e) {}
})();

</script>
</body>
