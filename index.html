<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>ML Тренажёр</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#141a26;--ink2:#566074;--line:#e2e6ee;
  --acc:#2a6fd6;--acc-ink:#ffffff;--acc2:#e8f0fc;
  --ok:#16825a;--okbg:#e5f6ee;--bad:#c93a3a;--badbg:#fcebeb;--warn:#a96b00;--warnbg:#fff4dc;
  --code:#f1f4f9;--shadow:0 1px 2px rgba(20,26,38,.06),0 6px 18px rgba(20,26,38,.05);
  --c-algo:#2a6fd6;--c-py:#14946a;--c-math:#6a4fc4;--c-ml:#d9622b;--c-dl:#c2467f;--c-code:#2f8f2f;--c-sd:#a87800;
  --tk-kw:#cf222e;--tk-str:#0a3069;--tk-com:#6e7781;--tk-num:#0550ae;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1118;--card:#171b25;--ink:#e9edf5;--ink2:#9aa4b8;--line:#2a3142;
    --acc:#6aa8f5;--acc-ink:#0b1220;--acc2:#1b2a44;
    --ok:#4cc38f;--okbg:#10291f;--bad:#f07070;--badbg:#301618;--warn:#e0a63a;--warnbg:#2d2410;
    --code:#0f131b;--shadow:0 1px 2px rgba(0,0,0,.4);
    --c-algo:#6aa8f5;--c-py:#3fc79a;--c-math:#9b87f0;--c-ml:#f0905a;--c-dl:#ea78ac;--c-code:#62c562;--c-sd:#dfae3b;
    --tk-kw:#ff7b72;--tk-str:#a5d6ff;--tk-com:#8b949e;--tk-num:#79c0ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1118;--card:#171b25;--ink:#e9edf5;--ink2:#9aa4b8;--line:#2a3142;
  --acc:#6aa8f5;--acc-ink:#0b1220;--acc2:#1b2a44;
  --ok:#4cc38f;--okbg:#10291f;--bad:#f07070;--badbg:#301618;--warn:#e0a63a;--warnbg:#2d2410;
  --code:#0f131b;--shadow:0 1px 2px rgba(0,0,0,.4);
  --c-algo:#6aa8f5;--c-py:#3fc79a;--c-math:#9b87f0;--c-ml:#f0905a;--c-dl:#ea78ac;--c-code:#62c562;--c-sd:#dfae3b;
  --tk-kw:#ff7b72;--tk-str:#a5d6ff;--tk-com:#8b949e;--tk-num:#79c0ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
.wrap{max-width:780px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
h1{font-size:26px;line-height:1.2;margin:0}
h2{font-size:19px;margin:26px 0 10px}
h3{font-size:16px;margin:0}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.muted{color:var(--ink2)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hdr{display:flex;align-items:flex-start;gap:12px;margin:6px 0 16px}
.hdr .sub{color:var(--ink2);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:center;line-height:1.25}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
.icon-btn{width:40px;height:40px;min-height:40px;padding:0;border-radius:12px;font-size:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc,var(--acc));border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--tc,var(--acc))}
.tcard .tt{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.tcard .em{font-size:22px;line-height:1.1}
.tcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin:8px 0 6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}.bar .b{background:var(--acc)}
.t-algo{--tc:var(--c-algo)}.t-py{--tc:var(--c-py)}.t-math{--tc:var(--c-math)}.t-ml{--tc:var(--c-ml)}.t-dl{--tc:var(--c-dl)}.t-code{--tc:var(--c-code)}.t-sd{--tc:var(--c-sd)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink2);min-height:28px}
.chip.t{color:var(--tc);border-color:color-mix(in srgb,var(--tc) 40%,var(--line));background:color-mix(in srgb,var(--tc) 10%,var(--card))}
button.chip{cursor:pointer;min-height:36px;padding:4px 14px}
button.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--ink2)}
.warnbox{background:var(--warnbg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.topbar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.topbar .count{font-weight:700;font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2)}
.timer.low{color:var(--bad)}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:0 0 12px;white-space:pre-line}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
:not(pre)>code{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.88em}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;overflow-x:auto;font-size:13.5px;line-height:1.5;white-space:pre;tab-size:4;-webkit-overflow-scrolling:touch}
pre.code code{background:none;border:0;padding:0;font-size:inherit}
.tk-kw{color:var(--tk-kw)}.tk-str{color:var(--tk-str)}.tk-com{color:var(--tk-com);font-style:italic}.tk-num{color:var(--tk-num)}
.opts{display:grid;gap:10px;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);min-height:52px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2);margin-top:1px}
.opt .otxt{flex:1;line-height:1.45}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.sel .key{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default;color:inherit}
.inp,.ta{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.inp:focus,.ta:focus{outline:none;border-color:var(--acc)}
.ta{min-height:130px;resize:vertical;line-height:1.5}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;margin:4px 0 10px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .ans{display:block;font-weight:500;color:var(--ink);margin-top:4px}
.explain{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;white-space:pre-line}
.explain .ex-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.kw .chip.hit{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.kw .chip.miss{color:var(--ink2)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1 1 150px}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-size:52px;font-weight:800;line-height:1.1}
.score .lbl{color:var(--ink2)}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt td,.rt th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rt th{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.rt .bar{min-width:70px}
.mistake{border-left:4px solid var(--bad)}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flash .face{flex:1}
.flash .hint{color:var(--ink2);font-size:13px;text-align:center;margin-top:10px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
details.sec>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--ink2);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.ct{width:100%;border-collapse:collapse;font-size:14px}
.ct th,.ct td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal}
.ct th{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
ul.cl{margin:0;padding-left:20px}
ul.cl li{margin:5px 0}
.search{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:20px;z-index:30}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.foot{margin-top:28px;text-align:center;color:var(--ink2);font-size:13px}
.hide{display:none!important}
@media (max-width:420px){
  h1{font-size:23px}
  .qtext{font-size:17px}
  .stat b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<noscript><div class="wrap"><p>Для работы тренажёра нужен JavaScript. Откройте файл в обычном браузере (Safari, Chrome).</p></div></noscript>
<script>
'use strict';
// ===== Хелперы для банка вопросов =====
// C — выбор ответа: C(тема, вопрос, [варианты], индексПравильного, разбор, {code, run})
// N — число:        N(тема, вопрос, значение, допуск, разбор, {code})
// I — короткий текст: I(тема, вопрос, [допустимые ответы], разбор, {code})
// O — развёрнутый:  O(тема, вопрос, эталон, [[метка, подстрока1, подстрока2…]], совет, {code})
const QS = [];
const CHEAT = [];
function C(t, q, o, a, e, x) { QS.push(Object.assign({ t: t, k: 'c', q: q, o: o, a: a, e: e || '' }, x || {})); }
function N(t, q, v, tol, e, x) { QS.push(Object.assign({ t: t, k: 'n', q: q, v: v, tol: tol, e: e || '' }, x || {})); }
function I(t, q, acc, e, x) { QS.push(Object.assign({ t: t, k: 'i', q: q, acc: acc, e: e || '' }, x || {})); }
function O(t, q, ref, kw, e, x) { QS.push(Object.assign({ t: t, k: 'o', q: q, ref: ref, kw: kw, e: e || '' }, x || {})); }

// ===== Алгоритмы и структуры данных (глава 1) =====
C("algo","Какова сложность операции `x in lst` для списка из n элементов (худший случай)?",["O(1)","O(log n)","O(n)","O(n log n)"],2,"Список — это массив, поиск идёт перебором. Если нужна проверка принадлежности за O(1) в среднем, используйте `set` или `dict`.");

C("algo","Почему `list.append` называют операцией O(1) амортизированно?",["Список хранит элементы в хеш-таблице","При нехватке места ёмкость растёт геометрически, поэтому редкие копирования O(n) «размазываются» по многим вставкам","append всегда пишет в заранее выделенную ячейку и никогда не копирует память","Элементы добавляются в двусвязный список"],1,"CPython выделяет память с запасом. Копирование всего массива случается редко (после 1, 2, 4, 8… элементов), и в среднем на одну вставку приходится O(1).");

C("algo","Решение Two Sum через словарь «значение → индекс»: какая сложность?",["O(n) по времени и O(n) по памяти","O(n log n) по времени и O(1) по памяти","O(n²) по времени и O(n) по памяти","O(n) по времени и O(1) по памяти"],0,"Один проход по массиву, словарь хранит до n элементов. Вариант O(n log n) / O(1) — сортировка и два указателя, но тогда теряются исходные индексы. Важно: сначала проверяем наличие дополнения, потом добавляем текущий элемент.");

C("algo","В массиве есть отрицательные числа. Нужно посчитать подмассивы с суммой k. Почему не подходит скользящее окно?",["При отрицательных числах расширение окна может уменьшить сумму: нет монотонности. Нужны префиксные суммы и хеш-таблица","Скользящее окно не работает с целыми числами","Окно нельзя сдвигать влево","Сумма может не поместиться в int"],0,"Окно работает, когда расширение окна только увеличивает сумму, а сжатие только уменьшает. С отрицательными числами это не так. Подмассив (j, i] имеет сумму k, если p[i] − p[j] = k, то есть p[j] = p[i] − k: ищем это в словаре частот префиксов.");

C("algo","В решении «число подмассивов с суммой k» перед циклом кладут `count[0] = 1`. Зачем?",["Чтобы учесть подмассивы, начинающиеся с индекса 0 (пустой префикс с суммой 0)","Чтобы избежать KeyError","Чтобы обнулить счётчик","Это необязательная оптимизация"],0,"Если весь префикс p[i] равен k, то нужно найти «пустой префикс» p[j] = 0 при j = 0. Без `count[0] = 1` такие подмассивы не будут посчитаны.");

C("algo","Бинарный поиск первого индекса, где `a[i] >= x`, цикл `while lo < hi`. Что делать при `a[mid] >= x`?",["hi = mid (mid может быть ответом)","hi = mid - 1","lo = mid + 1","lo = mid"],0,"Инвариант: ответ лежит в [lo, hi]. Если предикат истинен, ответ — mid или левее, значит hi = mid. Если ложен — строго правее: lo = mid + 1. Цикл заканчивается, когда отрезок схлопнулся в точку.");

C("algo","Что должно выполняться, чтобы применить бинарный поиск по ответу (например, минимальная скорость в задаче Koko Eating Bananas)?",["Предикат «значение x подходит» монотонен: если подходит x, то подходит и любое большее (или наоборот)","Входной массив должен быть отсортирован","Ответ должен быть простым числом","Размер входа должен быть степенью двойки"],0,"Монотонность предиката — единственное требование. Тогда мы ищем границу между «не подходит» и «подходит» за O(log диапазона) проверок.");

C("algo","Koko Eating Bananas: n кучек, ответ ищем бинпоиском на отрезке [1, max(piles)]. Итоговая сложность?",["O(n · log(max(piles)))","O(n²)","O(n)","O(log n)"],0,"Одна проверка скорости (сумма ceil(p/k)) стоит O(n), а проверок — O(log max).");

C("algo","Почему Daily Temperatures на монотонном стеке работает за O(n), несмотря на вложенный `while`?",["Каждый индекс кладётся в стек и снимается не более одного раза","Внутренний while выполняется не более двух раз за итерацию","Стек всегда содержит не более log n элементов","На самом деле он работает за O(n²)"],0,"Суммарное число снятий со стека не превышает числа добавлений, то есть n. Это амортизированный анализ.");

C("algo","Как найти k самых частых элементов за O(n log k)?",["Counter и min-куча размера k: при переполнении выбрасываем самый редкий","Отсортировать массив и взять последние k","Построить max-кучу из n элементов и k раз достать максимум за O(n log n)","Бинарный поиск по значению частоты"],0,"Куча размера k стоит O(log k) на операцию, операций — по числу уникальных элементов. Альтернатива: bucket sort по частотам за O(n).");

C("algo","`heapq` в Python реализует min-кучу. Как получить max-кучу для чисел?",["Класть в кучу отрицательные значения (или кортежи `(-priority, item)`)","Вызвать `heapq.heapify(a, reverse=True)`","Использовать `heapq.maxheap`","Всегда сортировать список по убыванию"],0,"В `heapq` нет параметра reverse. Стандартный приём — менять знак приоритета.");

C("algo","Как поддерживать медиану потока чисел?",["Max-куча для меньшей половины и min-куча для большей; размеры отличаются не более чем на 1","Одна отсортированная структура, в которую вставляем за O(1)","Две min-кучи","Хранить все числа и каждый раз сортировать"],0,"Вершина max-кучи — верхняя граница меньшей половины, вершина min-кучи — нижняя граница большей. Медиана — одна из вершин или их среднее. Добавление O(log n), чтение медианы O(1).");

O("py","Объясните, что такое GIL, к чему он приводит и как работать в многопоточных/CPU-bound задачах.",
"GIL (Global Interpreter Lock) — мьютекс в CPython: в каждый момент байт-код исполняет только один поток. Он упрощает подсчёт ссылок и написание C-расширений. Следствие: потоки не ускоряют CPU-bound код на чистом Python, но подходят для I/O-bound задач (GIL отпускается при ожидании). Для CPU-bound: multiprocessing, вынос вычислений в NumPy/PyTorch/Numba/Cython (они отпускают GIL), либо free-threaded сборка Python 3.13+ (PEP 703). GIL не делает код потокобезопасным: нужны Lock/Queue.",
[["Один поток исполняет байт-код","один поток","мьютекс","блокировк"],["I/O-bound: потоки / asyncio","i/o","io-bound","ввод","сеть","asyncio"],["CPU-bound: multiprocessing","multiprocessing","процесс"],["NumPy/C-расширения отпускают GIL","numpy","c-расширен","cython"],["Free-threaded 3.13+","3.13","без gil","free"]],
"Хороший финал ответа: «в PyTorch DataLoader для обхода GIL использует процессы».");

O("py","Что такое декоратор? Как устроен декоратор с параметрами, например `@retry(times=3)`?",
"Декоратор — функция, принимающая функцию и возвращающая новую (обычно обёртку): `@d` над `def f` эквивалентно `f = d(f)`. Обёртка принимает `*args, **kwargs`, вызывает исходную функцию и добавляет поведение до или после. `@functools.wraps` сохраняет метаданные. Декоратор с параметрами — это фабрика декораторов, три уровня вложенности: `retry(times)` возвращает `decorator(func)`, который возвращает `wrapper(*args, **kwargs)`. Применения: логирование, замер времени, кеширование (`lru_cache`), повторы, проверка прав.",
[["Функция принимает функцию и возвращает функцию","принимает функцию","возвращает","обёртк"],["f = d(f)","d(f)","@"],["*args, **kwargs","args","kwargs"],["functools.wraps","wraps"],["Три уровня вложенности для параметров","три","фабрик","уровн"]],
"Если просят написать: сначала декоратор timer без параметров, затем добавьте внешний уровень для параметров.");

O("py","В чём разница между итератором, итерируемым объектом и генератором? Где генераторы полезны в ML?",
"Итерируемый объект (iterable) умеет выдавать итератор через `__iter__` (список, строка, файл). Итератор имеет `__next__` и бросает `StopIteration` в конце; он одноразовый. Генератор — функция с `yield`, которая при вызове возвращает итератор и лениво выполняет тело по шагам, сохраняя состояние. Преимущество — память O(1) и ленивость. В ML: построчное чтение огромных файлов, батчирование датасета, бесконечные потоки аугментаций, стриминговая обработка логов.",
[["Итерируемый: __iter__","__iter__","итерируем"],["Итератор: __next__, StopIteration","__next__","stopiteration","итератор"],["Генератор: yield, ленивость","yield","ленив","генератор"],["Память O(1)","память","o(1)"],["Применение: батчи, файлы, потоки","батч","файл","поток","строк"]],
"Подвох: итератор можно пройти один раз, повторный проход молча даст пустой результат.");

O("py","Как устроены `dict` и `list` в CPython? Почему поиск в dict в среднем O(1), а вставка в начало списка O(n)?",
"`list` — динамический массив указателей на объекты. Вставка в начало сдвигает все элементы: O(n). `append` амортизированно O(1) за счёт геометрического роста ёмкости. `dict` — хеш-таблица с открытой адресацией: по `hash(key)` выбирается слот, коллизии разрешаются пробированием; при заполнении примерно на 2/3 таблица расширяется. С Python 3.6 используется компактная раскладка (разреженный массив индексов и плотный массив записей), поэтому порядок вставки сохраняется. Поиск O(1) в среднем, O(n) в худшем при массовых коллизиях.",
[["list — динамический массив","массив","динамическ"],["Вставка в начало сдвигает элементы O(n)","сдвиг","o(n)"],["dict — хеш-таблица","хеш"],["Коллизии, расширение таблицы","коллиз","расшир","2/3"],["Порядок вставки с 3.7","порядок","вставк"]],
"Для очереди используйте `collections.deque`: `popleft` за O(1).");

O("py","Назовите самые частые ошибки в PyTorch-коде обучения модели.",

[["zero_grad","zero_grad"],["eval и no_grad","eval","no_grad"],["Логиты в CrossEntropyLoss","логит","softmax","crossentropy"],["loss.item()","item","detach"],["Устройства / deepcopy / in-place","device","устройств","deepcopy","in-place"]],

O("math","Выведите решение линейной регрессии методом наименьших квадратов. Когда оно не существует или нестабильно и что с этим делать?",
"L(w) = ‖Xw − y‖² = wᵀXᵀXw − 2yᵀXw + yᵀy. Градиент: 2XᵀXw − 2Xᵀy. Приравниваем к нулю и получаем нормальное уравнение XᵀXw = Xᵀy, откуда w* = (XᵀX)⁻¹Xᵀy. Функция выпукла (гессиан 2XᵀX положительно полуопределён), поэтому стационарная точка — глобальный минимум. Если столбцы X линейно зависимы (мультиколлинеарность), XᵀX вырождена или плохо обусловлена. Решения: L2-регуляризация (XᵀX + λI всегда обратима при λ > 0), удаление или объединение признаков, PCA, использование `lstsq`/SVD вместо явного обращения.",
[["Градиент 2XᵀXw − 2Xᵀy","градиент","2x"],["Нормальное уравнение XᵀXw = Xᵀy","нормальн","xᵀxw","xtxw"],["Выпуклость → глобальный минимум","выпукл","глобальн"],["Мультиколлинеарность → вырожденность","коллинеар","вырожд","обусловл"],["Ridge: λI","ridge","λi","регуляр"]],
"На интервью хорошо звучит добавление: «на практике я бы использовал `np.linalg.solve` или `lstsq`, а не `inv`».");

O("math","Как вы объясните p-value нетехническому менеджеру и чего оно НЕ означает?",
"p-value — это вероятность увидеть такой же или более сильный результат, как в эксперименте, если на самом деле никакого эффекта нет (H₀ верна). Маленькое p-value означает, что «случайно» такой результат получился бы редко, поэтому мы отвергаем «эффекта нет». Оно НЕ означает вероятность того, что гипотеза верна; НЕ говорит, насколько эффект велик или важен для бизнеса (при огромной выборке значим даже ничтожный эффект); большое p-value не доказывает отсутствие эффекта (возможно, не хватило мощности).",
[["Определение через H₀ и «не менее экстремальный»","h₀","h0","нет эффекта","экстремальн"],["Не вероятность гипотезы","не вероятност","не означает"],["Не размер эффекта","размер","важн","практическ"],["Мощность / выборка","мощност","выборк"]],
"Добавьте доверительный интервал: он показывает и значимость, и размер эффекта.");

[["Множественные сравнения","множествен","15 метрик","сравнен"],["Поправка","бонферрони","холм","бенджамини","поправк"],["Главная метрика заранее","главн","заранее"],["SRM / проверка сплита","srm","сплит"],["Повторный эксперимент / размер эффекта","повтор","интервал","размер эффекта"]],

O("math","Объясните, как работает PCA, как выбрать число компонент и в каких случаях PCA не подходит.",
"Центрируем данные (и стандартизируем при разных шкалах), считаем ковариационную матрицу или SVD центрированной матрицы X = UΣVᵀ. Главные компоненты — столбцы V (собственные векторы XᵀX) в порядке убывания собственных значений; доля объяснённой дисперсии k-й компоненты λₖ/Σλ. Число компонент выбирают по накопленной объяснённой дисперсии (например, 90–95%), по «локтю» или по качеству downstream-модели. Не подходит: нелинейная структура (нужны t-SNE/UMAP/автоэнкодеры), когда важны признаки с малой дисперсией (PCA не учитывает таргет), когда нужна интерпретируемость исходных признаков.",

C("ml","Чем LightGBM отличается от XGBoost в росте деревьев?",["LightGBM растит дерево по листьям (leaf-wise): быстрее, но легче переобучить; XGBoost по умолчанию — по уровням","LightGBM использует только неглубокие деревья","Они одинаковы","LightGBM не поддерживает регрессию"],0,"Дополнительно в LightGBM: гистограммы, GOSS (сэмплирование по градиенту), EFB (склейка разреженных признаков).");

C("ml","В датасете 1% позитивов. Модель «всегда негатив» имеет accuracy 99%. Что смотреть вместо accuracy?",["PR-AUC, precision/recall при рабочем пороге, F1","Только accuracy на валидации","MSE","R²"],0,"При сильном дисбалансе ROC-AUC тоже может выглядеть оптимистично: FPR делится на огромное число негативов.");

N("ml","TP = 30, FP = 10, FN = 20. Чему равен F1? (округлите до сотых)",0.67,0.01,"Precision = 30/40 = 0.75; Recall = 30/50 = 0.6; F1 = 2·0.75·0.6/(0.75 + 0.6) = 0.667.");

C("ml","Как интерпретируется ROC-AUC?",["Вероятность того, что случайный позитивный объект получит скор выше случайного негативного","Доля правильных ответов при пороге 0.5","Среднее precision по порогам","Доля позитивных объектов в топ-k"],0,"AUC = 0.5 — случайный порядок, 1 — идеальный. Он инвариантен к монотонным преобразованиям скоров и не отражает калибровку.");

C("ml","ROC-AUC модели равен 0.3. Что это значит?",["Модель ранжирует «наоборот»: инвертировав скоры, получим AUC 0.7","Модель слабая, но порядок верный","Ошибка в расчёте: AUC не может быть меньше 0.5","Это эквивалентно accuracy 30%"],0,"AUC < 0.5 — признак перепутанных меток или знака скора. Для 1 − AUC достаточно инвертировать предсказания.");

N("ml","Чему равен коэффициент Gini, если ROC-AUC = 0.85?",0.7,0.001,"Gini = 2·AUC − 1 = 0.7. Так метрику называют в банковском скоринге.");

C("ml","Какое предсказание оптимально для MAE, а какое для MSE?",["MAE — медиана, MSE — среднее (условное матожидание)","MAE — среднее, MSE — медиана","Для обеих — мода","Для обеих — среднее"],0,"Поэтому MAE устойчива к выбросам, а MSE сильно штрафует большие ошибки. Квантильная функция потерь даёт оптимальный τ-квантиль.");

C("ml","В чём главный недостаток MAPE?",["Не определена при y = 0 и поощряет занижение прогнозов","Нечувствительна к масштабу","Слишком устойчива к выбросам","Не может быть отрицательной"],0,"Альтернативы: WAPE = Σ|y − ŷ|/Σ|y|, SMAPE, MAE.");

C("ml","Какая схема валидации нужна для данных во времени?",["TimeSeriesSplit / окно: обучение на прошлом, проверка на будущем","Обычный K-Fold с перемешиванием","Leave-one-out","Stratified K-Fold"],0,"Случайное разбиение даёт утечку из будущего и завышенную метрику. Иногда делают зазор (gap) между train и val.");

C("ml","Какая схема валидации нужна, если у каждого пользователя несколько записей?",["GroupKFold по пользователям","Обычный K-Fold","Stratified K-Fold по таргету без групп","Leave-one-out"],0,"Иначе одни и те же пользователи окажутся и в train, и в val: модель «запомнит» пользователей.");

C("ml","Масштабирование (StandardScaler) обучили на всём датасете, а потом разбили на train/test. Что не так?",["Утечка: статистики теста попали в обучение. Нужен Pipeline или fit только на train","Ничего, это стандартная практика","Нужно было использовать MinMaxScaler","Нужно было масштабировать только тест"],0,"То же касается импутации, отбора признаков, PCA, target encoding. В кросс-валидации используйте `Pipeline`.");

C("ml","Как корректно делать target encoding категориального признака?",["Out-of-fold: статистика для объекта считается по другим фолдам, со сглаживанием к глобальному среднему","Среднее таргета по всей выборке для каждой категории","Случайные числа для каждой категории","Только one-hot"],0,"Иначе объект «видит» собственную метку (утечка), особенно у редких категорий.");

C("ml","Что верно про ресэмплинг (SMOTE, undersampling) при дисбалансе?",["Выполняется только на train внутри кросс-валидации; вероятности после него нужно перекалибровать","Выполняется на всём датасете до разбиения","Всегда улучшает качество бустинга","Не меняет калибровку вероятностей"],0,"Если изменить долю классов при обучении, предсказанные вероятности смещаются, их нужно пересчитать или откалибровать на отложенной выборке.");

C("ml","Какие модели обычно плохо откалиброваны «из коробки»?",["Наивный Байес, SVM, случайный лес, бустинг с балансировкой классов, глубокие сети","Логистическая регрессия","Линейная регрессия","kNN с k = 1"],0,"Логистическая регрессия оптимизирует log-loss и обычно хорошо калибрована. Калибровка: Platt, isotonic, temperature scaling.");

C("ml","Когда isotonic regression для калибровки лучше Platt scaling?",["Когда данных достаточно много и искажение не сигмоидальное; при малых данных isotonic переобучается","Всегда","Когда данных очень мало","Когда нужно калибровать регрессию"],0,"Platt scaling — логистическая регрессия поверх скора, всего 2 параметра.");

C("ml","Чем permutation importance лучше MDI (impurity-based importance) деревьев?",["MDI считается на трейне и завышает важность непрерывных/высококардинальных признаков, permutation importance считается на валидации","MDI всегда точнее","Permutation importance не зависит от модели и не требует данных","Они совпадают"],0,"Минус permutation: при коррелированных признаках важность «делится» между двойниками и занижается.");

C("ml","Что даёт SHAP?",["Вклад каждого признака в конкретное предсказание на основе значений Шепли; можно агрегировать до глобальной важности","Только глобальную важность признаков","Причинно-следственные эффекты","Калибровку вероятностей"],0,"TreeSHAP считает точные значения для деревьев за полиномиальное время. Важность ≠ причинность.");

C("ml","Что верно про k-means?",["Находит локальный минимум inertia, чувствителен к инициализации, масштабу и выбросам; предполагает выпуклые «сферические» кластеры","Всегда находит глобальный оптимум","Сам определяет число кластеров","Работает с любой формой кластеров"],0,"Используют k-means++ и несколько запусков (`n_init`). Для кластеров произвольной формы и шума — DBSCAN.");

C("ml","Что верно про t-SNE?",["Для визуализации: сохраняет локальные соседства, расстояния между кластерами и их размеры на картинке ничего не значат","Подходит как предобработка для моделей так же, как PCA","Детерминирован и не зависит от параметров","Сохраняет глобальные расстояния"],0,"UMAP быстрее и лучше сохраняет глобальную структуру, его можно применять к новым точкам.");

C("ml","Для чего при стекинге нужны out-of-fold предсказания базовых моделей?",["Чтобы мета-модель обучалась на предсказаниях, сделанных не на тех объектах, на которых базовая модель училась (иначе утечка)","Чтобы ускорить обучение","Чтобы уменьшить число базовых моделей","Для балансировки классов"],0,"Блендинг — упрощённая версия с отдельной отложенной выборкой.");

C("ml","ROC-AUC (Gini) модели вырос, а прибыль упала. Что вероятнее всего объясняет это?",["Офлайн-метрика не соответствует бизнес-цели (порог, сегменты, калибровка, стоимость ошибок) либо есть утечка или сдвиг данных","Эффект случайности: AUC не связан с прибылью никогда","Ошибка в расчёте accuracy","Слишком большая выборка"],0,"Нужно смотреть метрику на рабочем пороге, по сегментам, в деньгах и проверять калибровку и дрейф.");

C("ml","На валидации качество отличное, а в проде плохое. Что проверить в первую очередь?",["Утечку, расхождение распределений (дрейф), training-serving skew и корректность схемы валидации","Только размер модели","Только версию Python","Ничего, это нормально"],0,"Часто причина — признаки в проде считаются иначе, чем при обучении, или валидация была случайной, а не по времени.");

C("ml","Как лучше всего обработать пропуски в признаке, если сам факт пропуска может быть информативным?",["Импутировать и добавить бинарный индикатор «пропущено»","Всегда удалить строки","Заполнить нулями без индикатора","Игнорировать пропуски"],0,"Статистики импутации считаются только на train. Бустинги (XGBoost, LightGBM, CatBoost) умеют работать с NaN напрямую.");

C("ml","Какая функция потерь подходит, если прогноз времени доставки нужно «выполнять» в 90% случаев (опоздание хуже раннего приезда)?",["Квантильная (pinball) с τ = 0.9","MSE","MAE","Accuracy"],0,"Квантильная потеря асимметрична: недооценка штрафуется сильнее переоценки. Дополнительно: прогноз в логарифмической шкале из-за скошенности.");

C("ml","Что такое NDCG@k?",["Дисконтированная сумма релевантностей с логарифмическим штрафом за позицию, нормированная на идеальный порядок","Доля релевантных документов среди первых k","Среднее обратных рангов первого релевантного","Площадь под ROC-кривой для топ-k"],0,"DCG@k = Σ (2^rel − 1)/log₂(i + 1). Значение NDCG лежит в [0, 1], 1 — идеальное ранжирование.");

C("ml","Чем MRR отличается от NDCG?",["MRR учитывает только позицию первого релевантного документа, а NDCG — все релевантные с градацией","MRR работает только с бинарной классификацией","NDCG не учитывает порядок","Они одинаковы"],0,"MRR = среднее 1/rank первого релевантного. Подходит для задач, где нужен один правильный ответ (QA, навигационный поиск).");

C("ml","Что верно про Naive Bayes?",["Предполагает условную независимость признаков при известном классе; вероятности плохо калиброваны; для нулевых частот нужно сглаживание Лапласа","Не требует предположений","Работает только с числами","Всегда лучше бустинга"],0,"Несмотря на «наивность», хорошо работает на текстах и малых данных, так как для классификации важен лишь argmax.");

C("ml","Чем дискриминативная модель отличается от генеративной?",["Дискриминативная моделирует P(y|x), генеративная — совместное P(x, y) и умеет генерировать данные","Дискриминативная всегда нелинейна","Генеративная работает только с изображениями","Разницы нет"],0,"Дискриминативные (логрег, SVM, бустинг) обычно точнее при достаточном объёме данных; генеративные (наивный Байес, GMM, VAE, LLM) лучше на малых данных.");

C("ml","Для задачи «предсказать отток, бюджет удерживающей кампании ограничен» лучше всего подходит...",["precision@k / lift@k и PR-AUC (важна верхушка списка), в идеале — ожидаемая экономия или uplift","accuracy","MSE","Только ROC-AUC"],0,"Сильнее вероятности оттока — предсказание эффекта воздействия (uplift-моделирование).");

C("ml","Test-выборка используется для...",["Финальной оценки качества один раз","Подбора гиперпараметров","Обучения","Выбора порога"],0,"Если многократно смотреть на тест и менять модель, он превращается в валидацию и оценка становится оптимистичной.");

C("ml","Что такое early stopping в бустинге и зачем он нужен?",["Остановка добавления деревьев, когда метрика на валидации перестала улучшаться; защита от переобучения","Остановка обучения при достижении нуля на трейне","Уменьшение learning rate","Остановка работы кросс-валидации"],0,"Число деревьев — гиперпараметр, подбираемый по валидации.");

C("ml","Дано: баннер показали 100 раз, было 3 клика. Как оценить CTR устойчивее, чем 3%?",["Байесовское сглаживание Beta-распределением (добавить априорные «показы/клики»)","Взять 0","Не оценивать","Использовать медиану"],0,"Beta(α, β) сопряжено с Bernoulli: CTR = (клики + α)/(показы + α + β). При малом числе показов оценка тянется к среднему.");

I("ml","Какая метрика классификации показывает долю найденных позитивов среди всех реальных позитивов? (одно слово)",["recall","полнота","tpr","sensitivity","чувствительность"],"Recall = TP/(TP + FN). Важна, когда дороги пропуски (фрод, болезни).");

I("ml","Как называется ошибка, когда мы пропускаем реальный эффект (не отвергаем неверную H₀)? (номер или «II рода»)",["II рода","2 рода","второго рода","ii","2","ошибка ii рода","ошибка 2 рода"],"Ошибка II рода — FN, вероятность β; мощность = 1 − β. Ошибка I рода — FP, вероятность α.");

I("ml","Какой метод кластеризации умеет находить шум и кластеры произвольной формы? (название)",["DBSCAN","db-scan"],"DBSCAN использует плотность в радиусе eps; минусы — подбор eps и разная плотность кластеров.");

O("ml","Объясните компромисс bias-variance и как он проявляется на кривых обучения.",
"Ожидаемая ошибка = Bias² + Variance + σ². Bias — систематическая ошибка из-за слишком простой модели; Variance — чувствительность к конкретной обучающей выборке из-за слишком гибкой модели. На кривых обучения: высокий bias — train и val ошибки высокие и близки; высокий variance — train низкая, val высокая, между ними разрыв. При росте сложности bias падает, variance растёт; оптимум — минимум суммы. Лечение bias: усложнить модель, добавить признаки, меньше регуляризации. Лечение variance: больше данных, регуляризация, бэггинг, dropout, early stopping, упрощение. В глубоких сетях возможен «двойной спуск».",
[["Bias² + Variance + шум","bias","шум"],["Недообучение: обе ошибки высокие","недообуч","обе"],["Переобучение: разрыв train/val","переобуч","разрыв"],["Лечение: данные, регуляризация, бэггинг","регуляриз","бэггинг","данных"],["Усложнение / признаки","усложн","признак"]],
"Нарисуйте U-образный график ошибки на тесте и отметьте оптимум: интервьюеры это любят.");

O("ml","Сравните бэггинг и бустинг: идея, что снижают, чувствительность к шуму и переобучению.",
"Бэггинг: независимые модели на бутстрап-выборках, усреднение; снижает variance; базовые модели — глубокие деревья; хорошо параллелится; число деревьев не приводит к переобучению (случайный лес). Бустинг: модели строятся последовательно, каждая исправляет ошибки ансамбля (в градиентном бустинге — аппроксимирует антиградиент функции потерь); снижает bias; базовые модели неглубокие; чувствительнее к шуму и выбросам, переобучается при большом числе деревьев, нужен early stopping и shrinkage. Современные реализации: XGBoost, LightGBM, CatBoost.",
[["Бэггинг: независимо, variance","независим","variance","бутстрап"],["Бустинг: последовательно, bias","последовательн","bias"],["Градиент / остатки","градиент","остатк"],["Переобучение бустинга / early stopping","early","переобуч"],["Параллелизм бэггинга","параллел"]],
"Формула дисперсии ансамбля ρσ² + (1 − ρ)σ²/B объясняет, зачем нужна декорреляция.");

O("ml","Что такое утечка данных (data leakage)? Приведите 4 типа с примерами и способами предотвращения.",
"Утечка — использование при обучении информации, недоступной в момент реального предсказания: метрики завышены, в проде модель хуже. Типы: 1) утечка таргета — признак, вычисленный после события (сумма возврата в задаче «вернут ли товар»); 2) утечка из будущего — случайное разбиение временного ряда, агрегаты за период, включающий будущее; 3) утечка при предобработке — scaler, импутация, PCA, отбор признаков обучены на всех данных до разбиения (решение: Pipeline); 4) target encoding без out-of-fold; 5) дубликаты и группы между train и test (GroupKFold). Диагностика: подозрительно высокая метрика и важность одного признака.",
[["Утечка таргета","таргет","после событ"],["Утечка из будущего / разбиение по времени","будущ","времен"],["Предобработка до разбиения / Pipeline","pipeline","предобработ","scaler"],["Target encoding out-of-fold","out-of-fold","target encoding","oof"],["Группы и дубликаты","групп","дубликат","groupkfold"]],
"Универсальный вопрос для каждого признака: «будет ли это значение известно в момент предсказания?»");

O("ml","Как бороться с сильным дисбалансом классов (1% позитивов)? Какую метрику выбрать?",
"Метрика: не accuracy, а PR-AUC, F1, recall при ограничении на precision, бизнес-стоимость; ROC-AUC при дисбалансе может быть оптимистичен. Методы: веса классов (`class_weight`, `scale_pos_weight`), ресэмплинг (undersampling большинства, oversampling, SMOTE) только на train внутри CV, focal loss, подбор порога вместо 0.5, ансамбли и сбор дополнительных данных. После ресэмплинга вероятности смещаются, их нужно перекалибровать. Всегда стратифицированное разбиение.",
[["PR-AUC, F1, recall, precision","pr-auc","f1","recall","precision"],["Веса классов","вес","class_weight"],["Ресэмплинг / SMOTE только на train","ресэмпл","smote","undersampl","oversampl"],["Порог","порог"],["Калибровка / стратификация","калибров","стратиф"]],
"Спросите, что дороже: пропуск или ложная тревога. От этого зависит, куда двигать порог.");

O("ml","Модель хорошо работает офлайн, но в A/B-тесте эффекта нет. Почему может быть так? Что проверите?",
"Причины: офлайн-метрика не соответствует бизнес-цели; selection bias офлайн-данных (логи старой модели) и position bias; утечка в офлайн-валидации; training-serving skew (разный расчёт признаков); дрейф данных между периодами; улучшена не та часть системы (узкое место — генерация кандидатов); выросла latency; эффекты новизны; недостаточная мощность теста; сломан сплит (SRM). Проверки: сравнить распределения признаков и предсказаний в проде и офлайн, пересчитать офлайн-метрику на залогированных онлайн-признаках, посмотреть сегменты, проверить мощность и SRM.",
[["Офлайн-метрика ≠ бизнес-цель","офлайн","бизнес"],["Смещения данных (selection, position)","смещени","selection","position"],["Training-serving skew / дрейф","skew","дрейф","расхожден"],["Мощность теста / SRM","мощност","srm"],["Узкое место в другой части системы","кандидат","узкое","latency"]],
"Хороший ответ структурирован по уровням: данные → модель → метрика → эксперимент.");

// ===== Deep Learning, трансформеры, LLM (глава 5) =====
C("dl","Зачем в нейросети нужны нелинейные функции активации?",["Без них композиция линейных слоёв остаётся линейным преобразованием: W₂(W₁x) = (W₂W₁)x","Чтобы ускорить вычисления","Чтобы уменьшить число параметров","Чтобы избежать переобучения"],0,"Нелинейность позволяет сети приближать сложные функции. Теорема об универсальной аппроксимации ничего не говорит о числе нейронов и о том, найдёт ли SGD такие веса.");

C("dl","Во сколько раз примерно обратный проход (backward) дороже прямого (forward)?",["≈ в 2 раза","≈ в 10 раз","Столько же","В 100 раз"],0,"Для каждого слоя нужно посчитать градиент и по весам, и по входу. Обучение ≈ 3× стоимости инференса. Память уходит и на активации, сохранённые для backward.");

C("dl","Для линейного слоя Y = XWᵀ + b при известном G = ∂L/∂Y градиент по весам равен...",["Gᵀ X","G X","X Gᵀ","Σ G"],0,"∂L/∂W = GᵀX (размер d_out × d_in), ∂L/∂b = Σ_batch G, ∂L/∂X = G W. Эти формулы нужно уметь выводить.");

C("dl","Почему сигмоида приводит к затуханию градиентов в глубоких сетях?",["Её производная не превышает 0.25 и почти нулевая в зоне насыщения, поэтому произведение множества таких множителей стремится к нулю","Сигмоида слишком дорогая в вычислении","Она не дифференцируема","Её выход симметричен относительно нуля"],0,"Поэтому используют ReLU/GELU, residual connections, нормализацию, правильную инициализацию.");

C("dl","Что такое «мёртвые нейроны» ReLU?",["Нейроны, у которых вход всегда отрицателен: градиент равен нулю, и они перестают обучаться","Нейроны с нулевыми весами","Нейроны, которых отключил dropout","Нейроны последнего слоя"],0,"Лечат Leaky ReLU, GELU, меньшим learning rate и правильной инициализацией.");

C("dl","He-инициализация для ReLU-сети имеет дисперсию весов...",["2 / fan_in","2 / (fan_in + fan_out)","1 / fan_out","Всегда 1"],0,"Xavier: 2/(fan_in + fan_out) — для tanh/sigmoid. Идея обоих: дисперсия активаций и градиентов не должна меняться от слоя к слою.");

C("dl","Почему нельзя инициализировать все веса слоя нулями?",["Все нейроны получат одинаковые градиенты и останутся одинаковыми (проблема симметрии)","Градиент станет бесконечным","Сеть не сможет посчитать forward","Обучение пойдёт слишком быстро"],0,"Смещения (bias) нулями инициализировать можно.");

C("dl","Почему residual connection y = x + F(x) помогает обучать глубокие сети?",["Якобиан равен I + ∂F/∂x, и градиент проходит по тождественной ветке без затухания","Она уменьшает число параметров","Она заменяет активации","Она делает функцию потерь выпуклой"],0,"Блоку достаточно выучить «поправку» к тождественному отображению. Это позволило обучать сети в сотни слоёв (ResNet).");

C("dl","Чем AdamW отличается от Adam с L2-регуляризацией?",["Weight decay применяется отдельно от адаптивного шага, а не через градиент: параметры с большими градиентами не регуляризуются слабее","AdamW использует другой β₂","AdamW не использует моменты","Они полностью идентичны"],0,"Для SGD обе схемы эквивалентны, для Adam — нет. AdamW — стандарт для трансформеров.");

C("dl","Зачем нужен warmup learning rate при обучении трансформеров?",["В начале веса случайны, а статистики Adam ненадёжны: большой шаг может «сломать» модель, поэтому lr плавно растёт от нуля","Чтобы ускорить сходимость к минимуму","Для регуляризации","Warmup не нужен"],0,"Типичный рецепт: линейный warmup 1–5% шагов и косинусное затухание.");

C("dl","Чем bf16 удобнее fp16 при обучении?",["Тот же диапазон экспоненты, что у fp32: loss scaling обычно не нужен","Точнее мантисса","Занимает меньше памяти","bf16 нельзя использовать на GPU"],0,"У fp16 узкий диапазон: малые градиенты обнуляются, поэтому нужен loss scaling. Мастер-копия весов хранится в fp32.");

C("dl","Что такое gradient accumulation?",["Суммирование градиентов нескольких микробатчей перед одним шагом оптимизатора: имитирует большой батч при ограниченной памяти","Накопление градиента по эпохам","Усреднение весов по эпохам","Метод удаления выбросов"],0,"Не забывайте делить лосс на число шагов накопления.");

C("dl","Как работает inverted dropout в PyTorch?",["На обучении оставшиеся активации умножаются на 1/(1 − p), на инференсе dropout выключен","На инференсе умножают на p","На обучении и инференсе поведение одинаково","Обнуляются веса, а не активации"],0,"Тогда матожидание выхода не меняется между режимами. Переключение: `model.train()` / `model.eval()`.");

C("dl","Почему в трансформерах используют LayerNorm, а не BatchNorm?",["LayerNorm не зависит от размера батча и других объектов, одинаково работает на обучении и инференсе, подходит для последовательностей переменной длины","LayerNorm быстрее","BatchNorm не поддерживает GPU","BatchNorm нельзя комбинировать с attention"],0,"BatchNorm опирается на статистики батча, а при генерации по одному токену они бессмысленны. RMSNorm — упрощённый LayerNorm без вычитания среднего (LLaMA и др.).");

C("dl","Чем Pre-LN трансформер отличается от Post-LN?",["Pre-LN нормализует вход подблока (x + F(LN(x))): градиент по residual-пути идёт без искажений, обучение глубоких моделей стабильнее","Post-LN использует больше параметров","Pre-LN не использует residual","Они идентичны"],0,"Современные LLM используют Pre-LN (или его варианты).");

N("dl","Conv2d(in=3, out=64, kernel=3, stride=2, padding=1) применяется к изображению 224×224. Какая высота выходной карты?",112,0,"H_out = ⌊(224 + 2·1 − 3)/2⌋ + 1 = ⌊223/2⌋ + 1 = 111 + 1 = 112.");

N("dl","Сколько параметров (с bias) у Conv2d(in=3, out=64, kernel=3)?",1792,0,"C_out·(C_in·K·K + 1) = 64·(27 + 1) = 1792. У полносвязного слоя на 3×224×224 → 64 их было бы около 9.6 млн.");

C("dl","Какое рецептивное поле у двух подряд идущих свёрток 3×3 (stride 1)?",["5×5","6×6","3×3","9×9"],0,"Три слоя 3×3 дают 7×7. При этом параметров меньше, чем у одного 7×7, а нелинейностей больше (идея VGG).");

C("dl","Для чего нужна свёртка 1×1?",["Смешивает каналы без пространственного контекста: дёшево меняет число каналов (bottleneck в ResNet)","Увеличивает рецептивное поле","Заменяет pooling","Нормализует активации"],0,"Также 1×1 после depthwise-свёртки образует depthwise separable convolution (MobileNet).");

C("dl","Как работает Non-Maximum Suppression (NMS) в детекции?",["Берём рамку с максимальным скором, удаляем все рамки с IoU выше порога, повторяем","Объединяет все перекрывающиеся рамки в одну усреднением","Удаляет рамки с низким скором","Делает рамки квадратными"],0,"Сложность O(n²) в худшем случае. Варианты: Soft-NMS, NMS по классам, батчевый NMS на GPU.");

C("dl","Почему LSTM лучше обычной RNN запоминает длинные зависимости?",["Состояние ячейки обновляется аддитивно через гейты: cₜ = fₜ⊙cₜ₋₁ + iₜ⊙c̃ₜ, что создаёт «магистраль» для градиента","В LSTM больше параметров","LSTM использует ReLU","LSTM не имеет рекуррентной связи"],0,"GRU — упрощённый вариант с двумя гейтами.");

C("dl","Главные причины, по которым трансформеры вытеснили RNN:",["Параллельные вычисления по всей последовательности и прямая связь между любыми токенами через attention","Меньше параметров","Линейная сложность по длине","Не нуждаются в данных"],0,"Цена — квадратичная сложность по длине. Современные state-space модели (Mamba) возвращают рекуррентность с линейной сложностью.");

C("dl","Зачем в scaled dot-product attention делят на √d_k?",["Если q и k независимы с единичной дисперсией, дисперсия qᵀk равна d_k; без деления softmax вырождается в почти one-hot с нулевыми градиентами","Чтобы ускорить вычисления","Чтобы нормировать вектор значений","Для регуляризации"],0,"Деление возвращает дисперсию логитов к 1 и сохраняет «мягкость» распределения внимания.");

C("dl","Сложность self-attention по длине последовательности n:",["O(n²·d) по времени и O(n²) по памяти на матрицу внимания","O(n·d)","O(n log n)","O(n³)"],0,"Это главное ограничение длинного контекста. FlashAttention убирает хранение матрицы n×n (память O(n)), оставаясь точным.");

C("dl","Приблизительное число параметров в одном блоке трансформера (d — размерность модели, без смещений и норм)?",["≈ 12·d² (4d² на attention и 8d² на FFN)","≈ d","≈ 2·d²","≈ d³"],0,"Attention: матрицы Q, K, V, O — 4d². FFN с расширением в 4 раза: 2·d·4d = 8d². Для GPT-2 small (d=768, 12 слоёв): ≈ 85M в блоках + ≈ 38M эмбеддинги.");

C("dl","Зачем трансформеру позиционные кодировки?",["Attention инвариантен к перестановке токенов, поэтому порядок нужно сообщить явно","Для уменьшения размера словаря","Чтобы избежать переобучения","Для ускорения softmax"],0,"RoPE поворачивает q и k так, что qᵀk зависит только от относительного сдвига. Также есть синусоидальные, обучаемые и ALiBi.");

C("dl","Как BERT отличается от GPT?",["BERT — encoder-only с двунаправленным контекстом и MLM, GPT — decoder-only с каузальной маской и предсказанием следующего токена","BERT генерирует текст, GPT — нет","BERT обучен только на переводе","Они идентичны"],0,"BERT: понимание (классификация, NER, эмбеддинги). GPT: генерация. T5, BART — encoder-decoder.");

C("dl","Что такое KV-cache?",["Сохранение ключей и значений уже обработанных токенов при авторегрессионной генерации, чтобы не пересчитывать их заново","Кеш весов модели","Кеш токенизатора","Кеш градиентов"],0,"Каждый новый токен требует O(n) вместо пересчёта всего контекста. Кеш занимает много памяти GPU; уменьшают его MQA/GQA и квантизация.");

C("dl","FlashAttention — это...",["Точный attention, вычисляемый блоками в быстрой SRAM без материализации матрицы n×n в HBM","Приближённый attention с отбрасыванием токенов","Линейный attention","Квантизация attention"],0,"Ускорение достигается сокращением обращений к памяти, а не аппроксимацией.");

C("dl","Что такое GQA (Grouped-Query Attention)?",["Группы голов запросов разделяют общие K и V: кеш KV уменьшается в разы при небольшой потере качества","Attention по группам токенов","Метод квантизации","Способ обучения с подкреплением"],0,"MQA — крайний случай: все головы используют одни K и V.");

C("dl","Как работает BPE-токенизация?",["Итеративно сливает самую частую пару соседних токенов в новый токен, пока не набран словарь нужного размера","Разбивает текст на слова по пробелам","Использует правила морфологии языка","Кодирует каждый символ отдельным токеном"],0,"Нет проблемы out-of-vocabulary. Объясняет странности LLM: проблемы с подсчётом букв и арифметикой, «дороговизну» русского текста.");

C("dl","Этапы создания LLM-ассистента в правильном порядке:",["Предобучение → SFT (instruction tuning) → выравнивание по предпочтениям (RLHF/DPO)","SFT → предобучение → RLHF","RLHF → SFT → предобучение","Только предобучение"],0,"Предобучение даёт знания, SFT — следование инструкциям, RLHF/DPO — предпочтения людей (полезность, безопасность).");

C("dl","Чем DPO отличается от RLHF с PPO?",["DPO оптимизирует политику напрямую на парах предпочтений, без отдельной reward model и RL-цикла","DPO не использует предпочтения","DPO обучает только reward model","DPO работает только для изображений"],0,"В RLHF: reward model (Брэдли–Терри) → PPO с KL-штрафом от SFT-модели. В DPO лосс использует отношение вероятностей политики и опорной модели.");

C("dl","Зачем в RLHF/PPO добавляют KL-штраф относительно исходной модели?",["Чтобы модель не «взломала» reward model и не деградировала по языку, уходя далеко от SFT-политики","Для ускорения обучения","Для уменьшения размера модели","Для балансировки классов"],0,"Без штрафа политика находит ответы с высокой наградой, но нечитаемые или бессмысленные.");

C("dl","LoRA обучает...",["Низкоранговую добавку ΔW = BA к замороженным весам W₀","Все веса модели с малым learning rate","Только эмбеддинги","Только bias"],0,"B инициализируют нулями, поэтому старт совпадает с исходной моделью. После обучения BA можно влить в W₀: инференс не замедляется.");

N("dl","Сколько обучаемых параметров у LoRA-адаптера ранга r = 8 для слоя 4096×4096 (A: r×4096, B: 4096×r)?",65536,0,"r·(d_in + d_out) = 8·(4096 + 4096) = 65 536 — против 16.8 млн у исходной матрицы (≈ 0.4%).");

C("dl","Чем top-p (nucleus) сэмплинг отличается от top-k?",["Берётся минимальный набор токенов с суммарной вероятностью ≥ p: размер набора адаптивный, а не фиксированный","Top-p фиксирует число токенов","Top-p использует температуру 0","Они идентичны"],0,"Температура T < 1 делает распределение острее, T > 1 — плоше. Greedy ≈ T → 0.");

C("dl","Какие этапы входят в RAG-систему?",["Индексация чанков в векторную БД → поиск (часто гибридный с BM25) → реранжирование → генерация с опорой на найденный контекст","Только генерация","Дообучение LLM на каждый запрос","Квантизация модели"],0,"Оценка: качество поиска (Recall@k, MRR) и качество ответа (faithfulness, точность), часто с LLM-as-a-judge.");

C("dl","Что показывает perplexity языковой модели?",["exp(среднее отрицательное лог-правдоподобие на токен): «эффективное число вариантов», из которых модель выбирает","Точность классификации","Скорость генерации","Число параметров"],0,"Сравнима только при одинаковом токенизаторе. Чем ниже, тем лучше.");

C("dl","Чем MoE (Mixture of Experts) отличается от плотной модели?",["Для каждого токена роутер активирует лишь 1–2 «эксперта» FFN: параметров много, а вычислений на токен мало","MoE использует меньше параметров","MoE — это метод регуляризации","MoE работает только в CV"],0,"Примеры: Mixtral, DeepSeek-MoE. Сложности: балансировка нагрузки экспертов и память.");

C("dl","Согласно работе Chinchilla, при фиксированном бюджете вычислений оптимальное число токенов обучения на один параметр примерно...",["20","1","1000","0.1"],0,"Современные модели часто обучают на заметно большем числе токенов, чтобы получить более дешёвый инференс.");

C("dl","Что делает contrastive-лосс InfoNCE (CLIP, SimCLR)?",["Притягивает представления позитивных пар и отталкивает негативы, используя softmax по сходству с температурой","Предсказывает следующий токен","Минимизирует MSE реконструкции","Максимизирует accuracy"],0,"L = −log[exp(sim(q, k₊)/τ) / Σⱼ exp(sim(q, kⱼ)/τ)]. Так обучают two-tower модели для поиска и рекомендаций.");

C("dl","Что делает `tensor.detach()` в PyTorch?",["Возвращает тензор, разделяющий память, но отрезанный от графа вычислений: градиент через него не течёт","Копирует тензор на CPU","Обнуляет градиент","Удаляет тензор из памяти"],0,"`torch.no_grad()` вообще не строит граф внутри контекста. `requires_grad_(False)` замораживает параметры.");

C("dl","Лосс в обучении стал NaN. Что проверить?",["Слишком большой lr (warmup, clipping), численно нестабильные операции (log(0), exp), переполнение fp16, NaN во входных данных","Только размер батча","Ничего, это временно","Только версию PyTorch"],0,"Помогают `torch.autograd.set_detect_anomaly(True)` и логирование нормы градиентов.");

C("dl","Модель не обучается: лосс не падает. Какой первый диагностический шаг?",["Попробовать переобучиться на одном маленьком батче: если не получается, ошибка в коде или данных","Сразу увеличить модель","Уменьшить обучающую выборку до нуля","Добавить dropout"],0,"Типичные баги: softmax перед CrossEntropy, забытый `zero_grad`, неверные метки, перепутанные оси, замороженные веса.");

C("dl","Какое из средств НЕ является способом борьбы с переобучением нейросети?",["Увеличение числа эпох без early stopping","Dropout","Аугментации данных","Weight decay"],0,"Больше эпох без контроля валидации усиливает переобучение. Остальное — регуляризация.");

O("dl","Объясните механизм self-attention и multi-head attention. Зачем делить на √d_k и что такое каузальная маска?",
"Каждый токен проецируется в query, key и value. Вес внимания токена i к токену j — softmax по j от qᵢ·kⱼ/√d_k. Выход i — взвешенная сумма value всех токенов: токен собирает информацию из всей последовательности с весами, зависящими от содержимого. Деление на √d_k возвращает дисперсию логитов к 1 и не даёт softmax насыщаться (иначе градиенты близки к нулю). Multi-head: h голов размерности d/h со своими проекциями, выходы конкатенируются и проецируются W_O; разные головы учат разные типы связей. Каузальная маска в декодере заменяет логиты «будущих» токенов на −∞ до softmax. Сложность O(n²·d).",
[["Q, K, V","query","key","value"],["softmax(QKᵀ/√d)·V","softmax"],["Зачем √d: дисперсия / насыщение","√d","дисперси","насыщ","градиент"],["Multi-head: разные подпространства","multi","голов","head"],["Каузальная маска / O(n²)","маск","−∞","-inf","n²"]],
"Нарисуйте матрицу внимания: строки — queries, столбцы — keys, нижний треугольник — каузальная маска.");

O("dl","Как работает backpropagation? Почему он эффективен и что нужно хранить в памяти?",
"Backprop — применение правила цепочки к вычислительному графу от выхода к входу. Прямой проход считает и сохраняет активации; обратный проход начинает с ∂L/∂L = 1 и для каждого узла умножает входящий градиент на локальную производную, суммируя вклады от разных путей. Эффективность: градиенты по всем параметрам считаются за стоимость порядка одного-двух forward (а не отдельно по каждому параметру). В памяти нужно хранить активации для backward; уменьшить расход можно через gradient checkpointing (пересчёт части активаций), смешанную точность и меньший батч. Для линейного слоя: dW = GᵀX, db = ΣG, dX = GW.",
[["Правило цепочки","цепочк","chain"],["Прямой проход, сохранение активаций","актива","forward","прямой"],["Обратный проход, суммирование путей","обратн","backward","сумм"],["Эффективность ≈ 2× forward","эффектив","дешев","≈","2"],["Checkpointing / память","checkpoint","памят"]],
"Если просят вывести градиент слоя, выпишите размерности: это защищает от ошибок с транспонированием.");

O("dl","Расскажите, как обучают и выравнивают LLM-ассистента: от предобучения до RLHF/DPO.",
"1) Предобучение: предсказание следующего токена на триллионах токенов (интернет, код, книги); модель получает знания, но не следует инструкциям. 2) SFT (instruction tuning): дообучение на парах «инструкция → хороший ответ». 3) Выравнивание по предпочтениям: RLHF — собираем сравнения «A лучше B», обучаем reward model (Брэдли–Терри), оптимизируем политику PPO с KL-штрафом от SFT-модели; DPO — оптимизация политики напрямую на парах предпочтений без reward model и RL-цикла; RLVR/GRPO — награда за проверяемую правильность (математика, код). Эффективное дообучение — LoRA/QLoRA.",
[["Предобучение: next token","предобуч","next token","следующ"],["SFT / instruction tuning","sft","инструкц"],["RLHF: reward model, PPO","rlhf","reward","ppo"],["KL-штраф","kl"],["DPO / LoRA","dpo","lora"]],
"Объясните, зачем KL-штраф: чтобы политика не уходила далеко от SFT-модели и не «взламывала» reward model.");

O("dl","Спроектируйте RAG-систему для вопросов по внутренней базе знаний. Как оценить её качество и какие риски?",
"Индексация: чанки с перекрытием, эмбеддинги, векторный индекс (HNSW/FAISS), метаданные. Поиск: запрос кодируется той же моделью, top-k; гибридный поиск (BM25 + векторный); реранкер (cross-encoder) на top-50. Генерация: LLM отвечает по найденному контексту, цитирует источники, говорит «не знаю», если контекста недостаточно. Оценка: поиск отдельно (Recall@k, MRR), ответ отдельно (точность, faithfulness, доля галлюцинаций), LLM-as-a-judge, откалиброванный на человеческой разметке, A/B. Риски: галлюцинации, prompt injection, утечка персональных данных, устаревание базы, стоимость и latency.",
[["Чанки, эмбеддинги, векторный индекс","чанк","эмбеддинг","индекс","faiss","hnsw"],["Гибридный поиск + реранкер","гибрид","bm25","реранк","rerank"],["Цитирование источников / «не знаю»","цитир","источник","не знаю"],["Метрики: Recall@k, faithfulness","recall","faithful","mrr","judge"],["Риски: галлюцинации, injection, PII","галлюцин","injection","персональн"]],
"Начните ответ с уточнения: объём базы, требования к latency и допустимая цена ошибки.");

C("code","Как реализовать численно устойчивый softmax?",["Вычесть максимум из логитов перед exp: результат не меняется, но исчезает overflow","Применить exp и разделить на сумму без изменений","Сначала взять log от логитов","Умножить логиты на 0.001"],0,"softmax(z) = softmax(z − max z). Для кросс-энтропии используют log-sum-exp: log Σ exp(zᵢ) = m + log Σ exp(zᵢ − m).");

C("code","В реализации логистической регрессии `log(p)` может дать −inf. Как защититься?",["Ограничить вероятности: `np.clip(p, eps, 1 - eps)` или считать лосс через логиты (BCEWithLogits)","Добавить 1 к вероятностям","Игнорировать, так не бывает","Использовать float16"],0,"Устойчивая сигмоида также считается раздельно для z ≥ 0 и z < 0, чтобы exp не переполнялся.");

C("code","Как проверить правильность ручной реализации backward (градиента)?",["Численный градиент центральной разностью (f(x + ε) − f(x − ε))/(2ε) на маленьком примере в float64","Сравнить с нулём","Запустить обучение и посмотреть на лосс","Посчитать градиент один раз и сохранить"],0,"Ошибка метода O(ε²). Стоимость — O(число параметров) прогонов forward, поэтому проверяют на малых размерах.");

C("code","Чем k-means++ лучше случайной инициализации центров?",["Каждый новый центр выбирается с вероятностью, пропорциональной квадрату расстояния до ближайшего выбранного: центры получаются разнесёнными","Гарантирует глобальный оптимум","Не требует итераций","Автоматически выбирает k"],0,"Даёт лучшие и более стабильные результаты и ускоряет сходимость. Алгоритм всё равно находит локальный оптимум, поэтому нужны несколько запусков.");

C("code","Как посчитать ROC-AUC за O(n log n) без построения кривой?",["Через ранги скоров (статистика Манна–Уитни): AUC = (Σранги_позитивов − n₊(n₊+1)/2)/(n₊·n₋), для равных скоров — средние ранги","Перебрать все пары объектов","Использовать accuracy при разных порогах","Взять среднее precision и recall"],0,"Перебор всех пар (позитив, негатив) — O(n²), хорошая «первая версия» на интервью. Пары с равными скорами вносят 0.5.");

C("code","Что вернёт функция precision, если модель не предсказала ни одного позитива (TP + FP = 0)?",["Деление на ноль: нужно явно обработать случай (обычно вернуть 0 или NaN) и обсудить его","0.5","1.0 автоматически","Ошибки не будет, NumPy вернёт число"],0,"Граничные случаи в метриках — любимый вопрос: один класс в выборке (ROC-AUC не определён), равные скоры, пустой вход.");

C("code","В цикле обучения с early stopping написано `best_state = model.state_dict()`. В чём баг?",["Словарь ссылается на живые тензоры и «лучшие» веса будут перезаписаны дальнейшим обучением: нужен `copy.deepcopy`","Нет бага","state_dict нельзя сохранять","Нужно использовать model.parameters()"],0,"Правильно: `best_state = copy.deepcopy(model.state_dict())` и в конце `model.load_state_dict(best_state)`.");

C("code","Как реализовать взвешенный случайный выбор индекса с вероятностями w[i]/Σw при многих вызовах?",["Префиксные суммы один раз + бинпоиск (bisect) по r ~ U[0, total): O(log n) на вызов","Каждый раз сортировать веса","Перебирать веса линейно с отдельным random для каждого","Использовать heapq"],0,"Для O(1) на вызов есть alias method (Уокера).");

C("code","Почему формула `E[x²] − E[x]²` для дисперсии потока может дать неверный результат?",["Катастрофическая потеря точности при больших значениях и малой дисперсии (может получиться даже отрицательное число); безопаснее алгоритм Уэлфорда","Она всегда верна","Работает только для целых","Формула неверна математически"],0,"Уэлфорд обновляет среднее и сумму квадратов отклонений инкрементально: `delta = x − mean; mean += delta/n; M2 += delta·(x − mean)`.");

C("code","Как реализовать rate limiter «не более N запросов за окно T секунд» для пользователя?",["deque времён запросов: выбрасываем старше T, если длина < N — разрешаем и добавляем","Глобальный счётчик без привязки ко времени","Сортировать все запросы при каждом вызове","Хранить только последний запрос"],0,"Альтернатива — token bucket: O(1) памяти на пользователя и допускает короткие всплески. В распределённой системе состояние хранят в Redis.");

O("code","Реализуйте (опишите) логистическую регрессию с нуля на NumPy: модель, лосс, градиент, шаг обновления, на что обратить внимание.",
"Модель: p = σ(Xw + b). Лосс — log-loss (бинарная кросс-энтропия) из MLE для Бернулли. Градиент: ∂L/∂w = Xᵀ(p − y)/n, ∂L/∂b = mean(p − y). Шаг: w ← w − η·∇. Реализация: инициализация нулями (для линейной модели допустимо), цикл по эпохам/батчам, векторизованные операции без циклов по объектам. Внимание: численно устойчивая сигмоида (раздельно для z ≥ 0 и z < 0), clip(p, eps, 1 − eps) перед log, масштабирование признаков, L2-регуляризация (на линейно разделимых данных веса иначе растут), проверка на sklearn и численный градиент, предсказание по порогу, который можно подбирать.",
[["σ(Xw + b)","сигмоид","σ","sigmoid"],["log-loss","log-loss","кросс-энтропи","logloss"],["Градиент Xᵀ(p − y)","xᵀ","p − y","p-y"],["Устойчивость: clip / сигмоида","clip","устойчив","eps"],["Регуляризация / масштабирование / проверка","регуляриз","масштаб","sklearn","численн"]],
"Если просят MLP или softmax-регрессию: градиент по логитам — (softmax − onehot)/n, остальное — chain rule.");

"Рассуждайте вслух по чек-листу: данные → разбиение → признаки → метрика → код обучения → воспроизводимость.");

O("code","Напишите SQL (опишите логику): Retention по недельным когортам для таблицы events(user_id, event_date).",
"1) CTE first_seen: для каждого пользователя неделя первого события `DATE_TRUNC('week', MIN(event_date))` — это когорта. 2) CTE activity: `DISTINCT` пары (user, cohort_week, week_number), где week_number — разность недель события и когорты, делённая на 7; DISTINCT, чтобы сколько бы событий ни было в неделе, пользователь считался один раз. 3) Агрегация по (cohort_week, week_number): число активных пользователей. 4) Retention = активные / размер когорты (активные на неделе 0) через оконную функцию `MAX(COUNT(DISTINCT user_id)) OVER (PARTITION BY cohort_week)`. Проверить: на неделе 0 retention = 1.",
[["Когорта = неделя первого события","first_seen","min","когорт"],["DATE_TRUNC / номер недели","date_trunc","week_number","недел"],["DISTINCT пользователь","distinct"],["Деление на размер когорты","размер когорт","over","partition"]],
"Практика: всегда проговорите, что считается «активностью» и в какой зоне времени.");

// ===== ML System Design, проекты, поведенческое интервью (главы 8–9) =====
C("sd","С чего нужно начинать ответ на ML System Design?",["С уточнения цели, метрик и ограничений (масштаб, latency, свежесть)","С выбора самой новой модели","С описания архитектуры сети","С оценки стоимости GPU"],0,"Постановка размыта намеренно. Сначала бизнес-цель → ML-задача → метрики, затем данные, признаки, baseline, модель, оценка, прод и мониторинг.");

C("sd","Зачем рекомендательные системы используют многостадийную архитектуру (candidate generation → ranking → re-ranking)?",["Объектов миллионы, ответ нужен за десятки мс: быстрые модели отбирают сотни кандидатов, тяжёлая модель ранжирует только их","Чтобы снизить bias","Потому что одна модель не может обучаться","Чтобы увеличить число параметров"],0,"Генерация кандидатов: ANN по эмбеддингам, коллаборативка, популярное. Ранжирование: бустинг/DNN с сотнями признаков. Re-ranking: разнообразие и бизнес-правила.");

C("sd","Что такое position bias в кликовых данных и как с ним бороться?",["Верхние позиции кликают чаще независимо от релевантности; помогают признак позиции, inverse propensity weighting, рандомизация позиций","Склонность модели к ранним токенам","Ошибка при сортировке","Разный размер групп в A/B-тесте"],0,"Также учитывайте selection bias (данные только о показанном) и popularity bias.");

C("sd","Что такое training-serving skew и как с ним бороться?",["Расхождение признаков при обучении и в проде; единый код (feature store), логирование признаков при инференсе, мониторинг распределений","Разница скорости обучения и инференса","Рассинхронизация версий CUDA","Разница размеров train и test"],0,"Тот же код признаков для офлайна и онлайна — главная защита.");

C("sd","Что такое point-in-time корректность при сборке обучающей выборки?",["Признаки берутся по состоянию на момент события, а не на текущий момент: иначе в них попадёт информация из будущего","Выбор времени обучения","Привязка модели к дате релиза","Балансировка выборки по времени"],0,"«Число покупок за 30 дней» должно считаться на дату события. Это одна из самых частых утечек в рекомендациях и скоринге.");

C("sd","Как решать холодный старт нового пользователя?",["Популярное и контекст, онбординг, быстрое обновление по первым действиям сессии","Не показывать рекомендации","Использовать только историю покупок","Предсказывать среднее по всем"],0,"Новый объект: контентные признаки и эмбеддинги вместо коллаборативных, квота показов (exploration), бандиты.");

C("sd","Зачем рекомендациям exploration?",["Без показа менее уверенных вариантов система не узнаёт о новых и недооценённых объектах и попадает в петлю обратной связи","Для увеличения latency","Для балансировки классов","Для снижения нагрузки"],0,"Методы: ε-greedy, UCB, Thompson sampling (сэмплирование CTR из Beta), квота для новых объектов.");

C("sd","Чем data drift отличается от concept drift?",["Data drift — изменение распределения входов P(x); concept drift — изменение зависимости P(y | x)","Они синонимы","Data drift — это ошибки данных, concept drift — ошибки модели","Data drift бывает только в CV"],0,"Data drift измеряют PSI, KL, KS-тестом. Concept drift заметен по падению качества на новых размеченных данных (мошенники меняют схемы).");

C("sd","Почему interleaving чувствительнее обычного A/B-теста для ранжирования?",["Выдачи двух моделей перемешиваются в одном списке, и каждый пользователь сравнивает обе: меньше дисперсия","Он требует больше трафика","Не требует кликов","Он измеряет только latency"],0,"Часто используют interleaving для быстрого отбора, а A/B для финального решения по бизнес-метрикам.");

C("sd","Антифрод в реальном времени: какая особенность задачи самая важная?",["Сильный дисбаланс, отложенные метки, адаптивный противник и жёсткая latency; цена ошибок асимметрична","Много данных с равными классами","Отсутствие необходимости в правилах","Метки всегда мгновенны"],0,"Решение — не бинарное: три зоны (пропустить, доп. проверка, заблокировать), пороги по стоимости ошибок и нагрузке на операторов.");

C("sd","Какая схема поиска чаще всего даёт лучшее качество в RAG/поиске?",["Гибрид: BM25 + векторный поиск с последующим реранкером (cross-encoder) на топ-N","Только векторный поиск по полному корпусу","Только BM25","Случайный выбор документов"],0,"Cross-encoder точнее, но дорог, поэтому применяется к небольшому числу кандидатов.");

C("sd","Как в LLM-ассистенте поддержки снизить галлюцинации?",["RAG с цитированием источников, ответы только по найденному контексту, «не знаю» и передача оператору, проверки безопасности","Увеличить температуру","Убрать контекст","Отвечать как можно длиннее"],0,"Оценка: Recall@k ретривера, faithfulness ответов, LLM-as-a-judge, откалиброванный на людях.");

C("sd","Как правильно подойти к выбору лоссов ранжирования?",["Pointwise (клик/нет), pairwise (кликнутый выше некликнутого), listwise (оптимизация метрики списка, LambdaMART)","Только MSE","Только accuracy","Всегда pairwise"],0,"Pointwise проще и даёт калиброванные вероятности; listwise лучше соответствует NDCG.");

C("sd","Метрика на валидации подозрительно близка к идеальной. Что скажете?",["Первым делом искать утечку данных (признаки из будущего, ID, дубликаты, предобработка до разбиения)","Это отличный результат, можно выкатывать","Нужно увеличить модель","Нужно уменьшить выборку"],0,"Типичная история на хакатонах: топ-1 важность — ID оператора, закреплённого за типом обращений.");

C("sd","Как лучше рассказывать о своём проекте на собеседовании?",["Контекст → постановка → метрика → данные → baseline → решение → результат в цифрах → неудачи → что дальше, с чётким разделением личного вклада","Перечислить все использованные библиотеки","Пересказать документацию","Рассказывать только про успехи, без неудач"],0,"Готовьте 2–3 проекта так, чтобы выдерживать 15–20 минут вопросов. Не приукрашивайте: преувеличение раскрывается уточнениями.");

O("sd","Спроектируйте блок «Похожие товары» для маркетплейса (сотни миллионов товаров, десятки тысяч запросов в секунду).",
"Уточнить: цель (рост конверсии и GMV), смысл «похожих» (замены), метрики (CTR, конверсия в покупку, GMV на показ; guardrails: latency < 50 мс, товары в наличии). Данные: co-view, co-purchase, каталог, тексты и изображения; позитивы — пары из одной сессии и категории, негативы — трудные из той же категории. Кандидаты: ANN по контентным эмбеддингам (текст + изображения, решает холодный старт) и коллаборативные (item2vec), фильтры по категории, цене и наличию. Ранжирование: бустинг по паре (товар, кандидат) с признаками близости, цены, рейтинга, популярности; позже — персонализация. Оценка: Recall@k/NDCG@k офлайн, A/B на конверсию и GMV. Прод: предвычисление и кеш для популярных товаров, онлайн ANN для хвоста, ежедневное обновление индекса, мониторинг CTR и дрейфа.",
[["Уточнение цели и метрик","цел","метрик","gmv","ctr"],["Данные: co-view / co-purchase","co-view","co-purchase","сесси"],["Кандидаты: эмбеддинги, ANN","эмбеддинг","ann","hnsw","кандидат"],["Ранжирование: бустинг, признаки","ранжир","бустинг","признак"],["Прод: кеш, latency, мониторинг","кеш","latency","мониторинг"]],
"Назовите цифры: сколько товаров, QPS и бюджет latency: они определяют, что предвычислять офлайн.");

O("sd","Спроектируйте систему антифрода для платежей в реальном времени.",
"Особенности: сильный дисбаланс (доли процента), отложенные и неполные метки (chargeback через недели), адаптивный противник (concept drift), latency десятки миллисекунд, асимметричная цена ошибок. Метрики: recall фрода при ограничении на долю ложных блокировок, PR-AUC, предотвращённый ущерб в деньгах. Признаки: сумма, MCC, канал; отклонение от привычного поведения клиента; скоростные признаки (число транзакций за 5 минут/час); графовые связи (устройство ↔ карты). Модель: правила как baseline и fallback + градиентный бустинг в реальном времени; графовые/последовательные модели для сложных схем; детекция аномалий. Решение — в три зоны (пропустить / доп. проверка / блокировать). Валидация строго по времени, учёт задержки меток, частое переобучение, мониторинг дрейфа.",
[["Дисбаланс и отложенные метки","дисбаланс","отложен","метк"],["Скоростные и графовые признаки","скорост","граф"],["Бустинг + правила","бустинг","правил"],["Три зоны решения / стоимость ошибок","зон","порог","стоимост"],["Валидация по времени / переобучение / дрейф","времен","переобуч","дрейф"]],
"Если спросят про метки: часть трафика можно пропускать без вмешательства модели, чтобы получать непредвзятые метки.");

"Ситуация и задача: контекст проекта и ваша ответственность. Действие: что именно вы обнаружили и сделали (например, заметили подозрительно высокую метрику, нашли утечку через ID оператора, перестроили валидацию по времени, убрали недоступные в проде признаки). Результат: метрика на валидации упала (честная оценка), но в закрытой проверке результат оказался лучше, чем у конкурентов; вывод для практики: подозрительно хорошая метрика — первый повод искать утечку, валидация должна имитировать реальный сценарий. Важно: честно признать ошибку, говорить «я», показать рефлексию и конкретные изменения в подходе.",

"Выберите историю, где ошибка реальная, но вы исправили её сами и можете сформулировать вывод.");

{t:"Bias-variance и борьба с переобучением",kind:"list",items:[
"Высокий bias: train и val ошибки высоки и близки → усложнить модель, добавить признаки, ослабить регуляризацию.",
"Высокий variance: train низкая, val высокая → больше данных, регуляризация, бэггинг, dropout, early stopping, аугментации, упрощение.",
"Бэггинг снижает variance (параллельно, глубокие деревья); бустинг снижает bias (последовательно, неглубокие деревья, нужен early stopping).",
"L1 → разреженность (лапласовское prior), L2 → малые веса (гауссовское prior); признаки нужно масштабировать.",
"Масштабирование нужно: kNN, SVM, k-means, PCA, линейные модели, нейросети. Не нужно: деревья и бустинг."]},

{t:"A/B-тесты: чек-лист",kind:"list",items:[
